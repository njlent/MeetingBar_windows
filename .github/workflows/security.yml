name: Windows Dependency Audit

on:
  pull_request:
    paths:
      - '**/*.csproj'
      - '.github/workflows/security.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.csproj'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  nuget-audit:
    name: Audit NuGet dependencies
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Restore Windows App SDK projects
        shell: pwsh
        run: |
          $audit = @(
            '-p:NuGetAudit=true'
            '-p:NuGetAuditMode=all'
            '-p:NuGetAuditLevel=low'
            '-p:TreatWarningsAsErrors=true'
          )
          dotnet restore .\SettingsApp\MeetingBar.Settings.csproj -r win-x64 -p:Platform=x64 @audit
          dotnet restore .\WidgetProvider\MeetingBar.WidgetProvider.csproj -r win-x64 -p:Platform=x64 @audit

      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          dotnet list .\SettingsApp\MeetingBar.Settings.csproj package --vulnerable --include-transitive
          dotnet list .\WidgetProvider\MeetingBar.WidgetProvider.csproj package --vulnerable --include-transitive
