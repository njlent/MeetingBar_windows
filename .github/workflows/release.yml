name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build, test, and publish release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build, test, and package Windows app
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Test -Package

      - name: Prepare versioned assets and release notes
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Unsupported release tag: $tag"
          }

          $version = $Matches.version
          $dist = Join-Path $PWD 'dist'
          $sourceZip = Join-Path $dist 'MeetingBar-Windows-portable.zip'
          $releaseZip = Join-Path $dist "MeetingBar-Windows-$tag-portable.zip"
          Move-Item $sourceZip $releaseZip -Force

          $hash = (Get-FileHash $releaseZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($releaseZip))" |
            Set-Content (Join-Path $dist 'SHA256SUMS.txt') -Encoding ascii

          $changelog = Get-Content '.\CHANGELOG.md' -Raw
          $escapedVersion = [regex]::Escape($version)
          $releaseMatch = [regex]::Match(
            $changelog,
            "(?ims)^##[ \t]+(?:\[$escapedVersion\]|$escapedVersion)[^\r\n]*(?:\r?\n|\z)(?<notes>.*?)(?=^##[ \t]+|\z)"
          )
          if (!$releaseMatch.Success) {
            throw "CHANGELOG.md does not contain a $version release section."
          }

          $releaseNotes = $releaseMatch.Groups['notes'].Value.Trim()
          foreach ($heading in @('Added', 'Fixed')) {
            # Windows runners check out CRLF, and .NET's multiline $ only matches before \n.
            if ($releaseNotes -notmatch "(?im)^###[ \t]+$heading[ \t]*\r?$") {
              throw "The $version changelog must contain a '$heading' subsection."
            }
          }

          if ($releaseNotes -match '(?im)^-[ \t]+(?:Add|Change|Correct|Detect|Embed|Enable|Expand|Fix|Improve|Keep|Make|Match|Move|Prevent|Remove|Replace|Restore|Synchronize|Update|Use)\b') {
            throw 'Release-note bullets must begin in the past tense.'
          }

          $notesPath = Join-Path $dist 'release-notes.md'
          [System.IO.File]::WriteAllText(
            $notesPath,
            $releaseNotes,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag `
            --repo $env:GITHUB_REPOSITORY `
            --title "MeetingBar_windows $($tag.TrimStart('v'))" `
            --notes-file '.\dist\release-notes.md' `
            --verify-tag `
            ".\dist\MeetingBar-Windows-$tag-portable.zip" `
            '.\dist\SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag." }

          "Release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag" >> $env:GITHUB_STEP_SUMMARY
