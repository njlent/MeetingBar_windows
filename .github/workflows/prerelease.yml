name: Windows Pre-release

on:
  push:
    branches:
      - main
    paths:
      - 'Interop/**'
      - 'Models/**'
      - 'Properties/**'
      - 'Resources/**'
      - 'Services/**'
      - 'SettingsApp/**'
      - 'Tests/**'
      - 'ViewModels/**'
      - 'Views/**'
      - 'WidgetProvider/**'
      - 'App.xaml'
      - 'App.xaml.cs'
      - 'app.manifest'
      - 'build.ps1'
      - 'CHANGELOG.md'
      - 'MeetingBar.Windows.csproj'
      - 'README.md'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/workflows/prerelease.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-prerelease
  cancel-in-progress: true

jobs:
  publish-prerelease:
    name: Build and publish rolling pre-release
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build, test, and package Windows app
        shell: pwsh
        run: .\build.ps1 -Configuration Release -Test -Package

      - name: Prepare release assets
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist'
          $zip = Join-Path $dist 'MeetingBar-Windows-portable.zip'
          $exe = Join-Path $dist 'MeetingBar-Windows-portable.exe'
          Copy-Item '.\bin\Release\MeetingBar.exe' $exe -Force

          $hashLines = foreach ($asset in @($zip, $exe)) {
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = [System.IO.Path]::GetFileName($asset)
            "$hash  $name"
          }
          $hashLines | Set-Content (Join-Path $dist 'SHA256SUMS.txt') -Encoding ascii

          $changelog = Get-Content '.\CHANGELOG.md' -Raw
          $unreleasedMatch = [regex]::Match(
            $changelog,
            '(?ims)^##[ \t]+(?:Unreleased|\[Unreleased\])[ \t]*(?:\r?\n|\z)(?<notes>.*?)(?=^##[ \t]+|\z)'
          )
          if (!$unreleasedMatch.Success) { throw 'CHANGELOG.md does not contain an Unreleased section.' }

          $unreleasedNotes = $unreleasedMatch.Groups['notes'].Value.Trim()
          $notesPath = Join-Path $dist 'prerelease-notes.md'
          [System.IO.File]::WriteAllText(
            $notesPath,
            $unreleasedNotes,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Publish rolling pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'windows-prerelease'
          $repo = $env:GITHUB_REPOSITORY
          $refApi = "repos/$repo/git/refs/tags/$tag"

          gh api $refApi --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH $refApi -f sha=$env:GITHUB_SHA -F force=true --silent
          } else {
            gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha=$env:GITHUB_SHA --silent
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not update the $tag tag." }

          gh release view $tag --repo $repo --json tagName 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $notes = '.\dist\prerelease-notes.md'

          if ($releaseExists) {
            gh release edit $tag --repo $repo --title 'MeetingBar for Windows - Latest Pre-release' --notes-file $notes --prerelease --latest=false --target $env:GITHUB_SHA
          } else {
            gh release create $tag --repo $repo --title 'MeetingBar for Windows - Latest Pre-release' --notes-file $notes --prerelease --latest=false --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the $tag release." }

          gh release upload $tag --repo $repo --clobber `
            '.\dist\MeetingBar-Windows-portable.zip' `
            '.\dist\MeetingBar-Windows-portable.exe' `
            '.\dist\SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw "Could not upload pre-release assets." }

          "Pre-release: https://github.com/$repo/releases/tag/$tag" >> $env:GITHUB_STEP_SUMMARY
